name: Build PropGuard Android APK

# This workflow does the actual compilation that isn't possible inside the
# sandboxed environment that generated this repo (no internet access there
# for Flutter/Gradle to download dependencies). GitHub-hosted runners have
# full internet access and the Android SDK preinstalled, so this produces
# a real, installable APK as a downloadable build artifact.

on:
  push:
    branches: [main]
    paths:
      - "mobile/flutter_app/**"
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/flutter_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      # --- Firebase config ---
      # Required secret: GOOGLE_SERVICES_JSON
      #   base64 of your real android/app/google-services.json, e.g.:
      #     base64 -i google-services.json | pbcopy   (macOS)
      #     base64 -w0 google-services.json            (Linux)
      #   then paste into Settings -> Secrets and variables -> Actions.
      - name: Write google-services.json from secret
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      # --- Release signing (optional but recommended) ---
      # Required secrets for a signed release build:
      #   ANDROID_KEYSTORE_BASE64  — base64 of your .jks file
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      # If these aren't set, build.gradle.kts falls back to debug signing
      # so the workflow still produces an installable (unsigned-for-release) APK.
      - name: Write release keystore from secret (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        # API_BASE_URL should point at your deployed FastAPI backend, not
        # localhost — set it as a repo variable (Settings -> Variables) or
        # hardcode your production URL here once you have one.
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://api.propguard.example.com' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: propguard-ai-release-apk
          path: mobile/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
